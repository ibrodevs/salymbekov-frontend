name: Frontend checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Lint CMS integration
        run: npx eslint src/App.jsx src/api.js src/components/cms/CmsCatchAllRoute.jsx src/components/cms/ManagedPageRoute.jsx src/hooks/usePageContent.js
      - name: Legacy full-repo lint report
        continue-on-error: true
        run: npm run lint
